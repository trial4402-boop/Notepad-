<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Notepad</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#7a8397; --accent:#2f6fed; --danger:#d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2030; --text:#e8ecf5; --muted:#8c96ad; --accent:#5b8cff; --danger:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; background:var(--accent); color:#fff; padding:12px 16px; font-size:20px; font-weight:600; z-index:2; display:flex; align-items:center; gap:8px; }
  .hbtn { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:10px; padding:8px 10px; font-size:14px; font-weight:600; }
  .search { padding:12px 16px 4px; }
  .search input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid transparent; background:var(--card); color:var(--text); font-size:16px; }
  #list { padding:8px 16px 96px; display:grid; gap:10px; }
  .note { background:var(--card); border-radius:14px; padding:14px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .note h3 { margin:0 0 4px; font-size:17px; }
  .note p { margin:0; color:var(--muted); font-size:14px; white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .note small { color:var(--muted); font-size:12px; display:block; margin-top:8px; }
  .empty { text-align:center; color:var(--muted); margin-top:60px; }
  .fab { position:fixed; right:20px; bottom:24px; width:58px; height:58px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:32px; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  #editor { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:5; }
  #editor.open { display:flex; }
  .bar { display:flex; gap:8px; align-items:center; padding:10px 12px; background:var(--accent); color:#fff; }
  .bar button { background:transparent; border:0; color:#fff; font-size:16px; padding:8px 10px; }
  .bar .spacer { flex:1; }
  #title { border:0; background:transparent; color:var(--text); font-size:22px; font-weight:600; padding:16px 16px 6px; outline:none; }
  #body { flex:1; border:0; background:transparent; color:var(--text); font-size:17px; line-height:1.5; padding:6px 16px 16px; resize:none; outline:none; font-family:inherit; }
</style>
</head>
<body>
<header>
  <span style="flex:1">Notepad</span>
  <button class="hbtn" id="backup">⬇ ব্যাকআপ</button>
  <button class="hbtn" id="restore">⬆ রিস্টোর</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<div class="search"><input id="q" type="search" placeholder="Search notes"></div>
<div id="list"></div>
<button class="fab" id="add" aria-label="New note">+</button>

<div id="editor">
  <div class="bar">
    <button id="back">← Back</button>
    <span class="spacer"></span>
    <button id="del" style="color:#ffd0d0">Delete</button>
  </div>
  <input id="title" placeholder="Title">
  <textarea id="body" placeholder="Start typing..."></textarea>
</div>

<script>
const KEY = "notepad.notes.v1";
let notes = [], current = null;
const $ = id => document.getElementById(id);

function load() { try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { notes = []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {} }

function render() {
  const q = $("q").value.trim().toLowerCase();
  const shown = notes
    .filter(n => !q || (n.title + " " + n.body).toLowerCase().includes(q))
    .sort((a, b) => b.updated - a.updated);
  const list = $("list");
  list.innerHTML = "";
  if (!shown.length) {
    list.innerHTML = '<div class="empty">' + (notes.length ? "No matches" : "No notes yet. Tap + to add one.") + "</div>";
    return;
  }
  shown.forEach(n => {
    const el = document.createElement("div");
    el.className = "note";
    const h = document.createElement("h3"); h.textContent = n.title || "Untitled";
    const p = document.createElement("p"); p.textContent = n.body;
    const s = document.createElement("small"); s.textContent = new Date(n.updated).toLocaleString();
    el.append(h, p, s);
    el.onclick = () => openEditor(n.id);
    list.appendChild(el);
  });
}

function openEditor(id) {
  current = notes.find(n => n.id === id);
  if (!current) return;
  $("title").value = current.title;
  $("body").value = current.body;
  $("editor").classList.add("open");
  if (!current.body && !current.title) $("title").focus();
}

function closeEditor() {
  if (current && !current.title.trim() && !current.body.trim()) {
    notes = notes.filter(n => n.id !== current.id);
    save();
  }
  current = null;
  $("editor").classList.remove("open");
  render();
}

function touch() {
  if (!current) return;
  current.title = $("title").value;
  current.body = $("body").value;
  current.updated = Date.now();
  save();
}

$("add").onclick = () => {
  const n = { id: String(Date.now()), title: "", body: "", updated: Date.now() };
  notes.push(n); save(); openEditor(n.id);
};
$("back").onclick = closeEditor;
$("del").onclick = () => {
  if (current && confirm("Delete this note?")) {
    notes = notes.filter(n => n.id !== current.id);
    save(); current = null;
    $("editor").classList.remove("open"); render();
  }
};
$("title").oninput = touch;
$("body").oninput = touch;
$("q").oninput = render;

// ---- Backup & Restore ----
$("backup").onclick = () => {
  if (!notes.length) { alert("ব্যাকআপ নেওয়ার মতো কোনো নোট নেই।"); return; }
  const data = { app: "notepad", version: 1, exportedAt: new Date().toISOString(), notes: notes };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const d = new Date(), pad = x => String(x).padStart(2, "0");
  const name = "notepad-backup-" + d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + ".json";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  alert("ব্যাকআপ ফাইল সেভ হয়েছে: " + name + "\nএটি Downloads ফোল্ডারে পাবেন। চাইলে SD কার্ডে কপি করে রাখুন।");
};

$("restore").onclick = () => $("file").click();

$("file").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const arr = Array.isArray(data) ? data : data.notes;
      if (!Array.isArray(arr)) throw new Error("bad");
      const clean = arr.map(n => ({
        id: String(n.id),
        title: String(n.title == null ? "" : n.title),
        body: String(n.body == null ? "" : n.body),
        updated: Number(n.updated) || Date.now()
      }));
      if (!confirm(clean.length + "টি নোট রিস্টোর হবে। বর্তমান সব নোট বদলে যাবে। এগিয়ে যাবেন?")) return;
      notes = clean; save(); render();
      alert("রিস্টোর সম্পূর্ণ হয়েছে: " + clean.length + "টি নোট।");
    } catch (err) {
      alert("এই ফাইলটি সঠিক ব্যাকআপ ফাইল নয়।");
    }
  };
  r.readAsText(f);
};

load(); render();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
</body>
</html>
